
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products API</title>
    <link rel="stylesheet" href="output.css">

</head>

<body class="bg-gray-100 min-h-screen ">

    <header class="sticky top-0 z-50 bg-white shadow-md p-6 ">
        <h1 class="text-3xl font-bold text-teal-700  text-center">
            Products Store
        </h1>
    </header>

    <main class="mx-auto p-6">

        <section class="mb-10">
            <h2 class="text-2xl font-bold mb-5">
                Categories
            </h2>

            <div id="categories"
                 class="flex flex-wrap gap-3">
            </div>
        </section>

        <section>
            <h2 class="text-2xl font-bold mb-5">
                Products
            </h2>

            <div id="products"
                 class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            </div>
        </section>

    </main>

     <footer class="bg-white shadow-inner p-4 text-center text-gray-500">
        <p>Products Store © 2026 - Data from dummyjson.com</p>
    </footer>

     <script src="main.js"></script>
</body>
</html>
